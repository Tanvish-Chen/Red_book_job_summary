<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小红书 AI 求职雷达</title>
<script src="data.js"></script>
<style>
  :root {
    --accent: #ff2442; --bg: #f6f6f8; --card: #ffffff; --text: #1f2329;
    --muted: #8a9099; --line: #e8e9ec; --job: #ff2442; --interview: #2f6fed;
    --insight: #0da868; --noise: #9aa2ad; --pending: #d98a00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .container { max-width: 1080px; margin: 0 auto; padding: 24px 16px 60px; }

  header h1 { font-size: 26px; letter-spacing: .5px; }
  header h1 .dot { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; min-width: 108px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat.job b { color: var(--job); } .stat.interview b { color: var(--interview); }
  .stat.insight b { color: var(--insight); } .stat.pending b { color: var(--pending); }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 14px; color: var(--muted); }
  .tab.active { background: var(--text); color: #fff; border-color: var(--text); }
  .tab .n { font-size: 12px; opacity: .75; margin-left: 3px; }
  input[type=search], select { padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; background: var(--card); outline: none; }
  input[type=search] { flex: 1; min-width: 180px; }

  .list { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; transition: box-shadow .15s; }
  .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.07); }
  .card .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 12px; color: #fff; border-radius: 6px; padding: 2px 8px; flex-shrink: 0; }
  .badge.job { background: var(--job); } .badge.interview { background: var(--interview); }
  .badge.insight { background: var(--insight); } .badge.noise { background: var(--noise); }
  .badge.pending { background: var(--pending); }
  .card h3 { font-size: 16.5px; line-height: 1.45; }
  .meta { font-size: 12.5px; color: var(--muted); margin-top: 5px; display: flex; gap: 12px; flex-wrap: wrap; }
  .summary { font-size: 14px; line-height: 1.7; margin-top: 9px; }
  .fields { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12.5px; background: #f2f3f5; border-radius: 6px; padding: 3px 9px; color: #444b54; }
  .chip.warn { background: #fff2e3; color: #b26a00; }
  .chip.dl-open { background: #fff2e3; color: #b26a00; }
  .chip.dl-soon { background: #ffe8e8; color: #d4380d; font-weight: 600; }
  .chip.dl-expired { background: #f0f1f3; color: #9aa2ad; text-decoration: line-through; }
  .chip.company { background: #fdeef0; color: var(--job); font-weight: 600; }
  details.questions { margin-top: 10px; }
  details.questions summary { font-size: 13px; color: var(--interview); cursor: pointer; user-select: none; }
  details.questions ol { margin: 8px 0 0 20px; font-size: 13.5px; line-height: 1.9; color: #3c434d; }
  .card .foot { margin-top: 10px; font-size: 12.5px; display: flex; gap: 14px; align-items: center; }
  .card .foot a { color: var(--interview); text-decoration: none; }
  .card .foot a:hover { text-decoration: underline; }
  .excerpt { color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
  footer { margin-top: 36px; color: var(--muted); font-size: 12.5px; line-height: 1.9; border-top: 1px solid var(--line); padding-top: 16px; }
  @media (max-width: 640px) { .stat { flex: 1; } header h1 { font-size: 21px; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>小红书 <span class="dot">AI 求职雷达</span></h1>
    <div class="sub">采集自小红书公开笔记 · 岗位 / 面经 / 攻略持续追踪 · 数据更新于 <b id="gen-at"></b></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="搜索标题 / 正文 / 公司 / 岗位…">
    <select id="f-company"><option value="">全部公司</option></select>
    <select id="f-location"><option value="">全部地点</option></select>
    <select id="f-direction"><option value="">全部方向</option></select>
    <select id="f-status">
      <option value="">时效不限</option>
      <option value="open">在招（未截止）</option>
      <option value="soon">即将截止（≤14天）</option>
      <option value="expired">已过期</option>
      <option value="none">未注明截止</option>
    </select>
    <select id="f-sort">
      <option value="time">按时间排序</option>
      <option value="liked">按热度排序</option>
    </select>
  </div>

  <div class="tabs" id="tabs"></div>
  <div style="height:14px"></div>
  <div class="list" id="list"></div>

  <footer>
    数据来源：MediaCrawler 采集的小红书公开笔记，仅用于个人求职学习，请勿商用或二次分发内容本身。
    分类与字段由 LLM 辅助提取，投递前务必点击「原文」核对最新信息。<br>
    更新流程：运行 MediaCrawler 采集 → LLM 整理 <code>pipeline/extracted.json</code> → <code>python pipeline/build_site.py</code> 重新生成。
  </footer>
</div>

<script>
const DATA = window.XHS_DATA || { stats: {}, notes: [] };
const CATS = [
  { key: "all",       label: "全部" },
  { key: "job",       label: "招聘信息" },
  { key: "interview", label: "面试面经" },
  { key: "insight",   label: "经验攻略" },
  { key: "pending",   label: "待分类" },
];
let curTab = "all";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function deadlineStatus(n) {
  if (!n.deadline_date) return "none";
  const days = Math.ceil((new Date(n.deadline_date + "T23:59:59") - new Date()) / 86400000);
  if (days < 0) return "expired";
  if (days <= 14) return "soon";
  return "open";
}

function init() {
  const s = DATA.stats || {};
  $("gen-at").textContent = s.generated_at || "—";
  $("stats").innerHTML = `
    <div class="stat"><b>${s.total ?? 0}</b><span>笔记总数</span></div>
    <div class="stat job"><b>${s.job ?? 0}</b><span>招聘信息</span></div>
    <div class="stat interview"><b>${s.interview ?? 0}</b><span>面试面经</span></div>
    <div class="stat insight"><b>${s.insight ?? 0}</b><span>经验攻略</span></div>
    <div class="stat pending"><b>${s.pending ?? 0}</b><span>待整理</span></div>`;

  const counts = { all: DATA.notes.length };
  CATS.slice(1).forEach((c) => (counts[c.key] = DATA.notes.filter((n) => n.category === c.key).length));
  $("tabs").innerHTML = CATS.map(
    (c, i) => `<div class="tab${i === 0 ? " active" : ""}" data-k="${c.key}">${c.label}<span class="n">${counts[c.key] ?? 0}</span></div>`
  ).join("");
  document.querySelectorAll(".tab").forEach((t) =>
    t.addEventListener("click", () => {
      curTab = t.dataset.k;
      document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
      render();
    })
  );

  const companies = [...new Set(DATA.notes.map((n) => n.company).filter(Boolean))].sort();
  const locations = [...new Set(DATA.notes.flatMap((n) => n.locations || []))].sort();
  const directions = [...new Set(DATA.notes.map((n) => n.direction).filter(Boolean))].sort();
  $("f-company").innerHTML += companies.map((c) => `<option>${esc(c)}</option>`).join("");
  $("f-location").innerHTML += locations.map((l) => `<option>${esc(l)}</option>`).join("");
  $("f-direction").innerHTML += directions.map((d) => `<option>${esc(d)}</option>`).join("");

  ["q", "f-company", "f-location", "f-direction", "f-status", "f-sort"].forEach((id) => $(id).addEventListener("input", render));
  render();
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const co = $("f-company").value;
  const loc = $("f-location").value;
  const dir = $("f-direction").value;
  const st = $("f-status").value;
  let list = DATA.notes.filter((n) => {
    if (curTab === "pending" ? n.category !== "pending" : curTab !== "all" && n.category !== curTab) return false;
    if (curTab === "all" && n.category === "noise" && !q) return false;
    if (co && n.company !== co) return false;
    if (loc && !(n.locations || []).includes(loc)) return false;
    if (dir && n.direction !== dir) return false;
    if (st && deadlineStatus(n) !== st) return false;
    if (q) {
      const hay = [n.title, n.desc, n.summary, n.company, ...(n.positions || []), ...(n.tags || [])].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if ($("f-sort").value === "liked") list = [...list].sort((a, b) => (+b.liked || 0) - (+a.liked || 0));
  return list;
}

function render() {
  const list = filtered();
  if (!list.length) { $("list").innerHTML = `<div class="empty">没有匹配的笔记</div>`; return; }
  $("list").innerHTML = list.map((n) => {
    const fields = [
      n.company && `<span class="chip company">${esc(n.company)}</span>`,
      ...(n.positions || []).map((p) => `<span class="chip">${esc(p)}</span>`),
      ...(n.locations || []).map((l) => `<span class="chip">📍 ${esc(l)}</span>`),
      n.deadline && (() => {
        const st = deadlineStatus(n);
        const suffix = st === "expired" ? "（已过期）" : st === "soon" ? "（即将截止）" : "";
        return `<span class="chip dl-${st}">⏰ ${esc(n.deadline)}${suffix}</span>`;
      })(),
      n.direction && `<span class="chip">${esc(n.direction)}</span>`,
      ...(n.tags || []).map((t) => `<span class="chip">#${esc(t)}</span>`),
    ].filter(Boolean).join("");
    const body = n.summary
      ? `<div class="summary">${esc(n.summary)}</div>`
      : `<div class="summary excerpt">${esc(n.desc.slice(0, 160))}…</div>`;
    const qs = (n.questions || []).length
      ? `<details class="questions"><summary>📄 展开真题列表（${n.questions.length} 题）</summary><ol>${n.questions.map((x) => `<li>${esc(x)}</li>`).join("")}</ol></details>`
      : "";
    return `<div class="card">
      <div class="top"><span class="badge ${n.category}">${n.category_label}</span><h3>${esc(n.title)}</h3></div>
      <div class="meta"><span>👤 ${esc(n.nickname)}</span><span>📅 ${n.date}</span><span>❤️ ${esc(n.liked)}</span><span>💬 ${esc(n.comment_count)}</span></div>
      ${body}${qs}
      ${fields ? `<div class="fields">${fields}</div>` : ""}
      <div class="foot"><a href="${n.url}" target="_blank" rel="noopener">原文链接 ↗</a></div>
    </div>`;
  }).join("");
}

init();
</script>
</body>
</html>
